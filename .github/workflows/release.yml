name: Release

# Publishes to npm when a version tag is pushed, such as v0.3.0. The tag must
# match the version in package.json. Publishing uses npm trusted publishing,
# so there is no token to keep: the openad package on npmjs.com lists
# this repository and this workflow as its trusted publisher. A version that
# is already on npm, such as one published by hand, is left alone.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Check whether npm has this version
        id: npm
        run: |
          if npm view "openad@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: |
          npm install --global npm@latest
          npm publish --provenance --access public
      - name: Create the GitHub release
        run: gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
